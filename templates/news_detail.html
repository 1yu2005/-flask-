{% extends "base.html" %}
{% block title %}{{ news.title }} - 星辰科技{% endblock %}

{% block content %}
<div class="card" style="padding: 40px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="font-size: 26px; color: #1a1a2e;">{{ news.title }}</h1>
        <span class="badge" style="font-size: 14px; padding: 4px 14px;">{{ news.category }}</span>
    </div>

    <div class="text-muted" style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #eee;">
        发布时间：{{ news.publish_time }}
    </div>

    <div style="font-size: 16px; line-height: 2; color: #444; white-space: pre-wrap;">{{ news.content }}</div>

    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
        <a href="/news" class="btn btn-primary">&larr; 返回新闻列表</a>
    </div>
</div>
{% endblock %}
